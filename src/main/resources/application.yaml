spring:
  config:
    # local runs: pick up RAZORPAY_* / STRIPE_* / KAFKA_* from a git-ignored .env file when one exists
    import: optional:file:.env[.properties]
  application:
    name: payment-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:production-fgivv4.eu.cluster.ntail.io:9092}
    # Cloud cluster login. Only the password is a secret: set KAFKA_PASSWORD in the environment, never in this file.
    # For a local plaintext broker set KAFKA_SECURITY_PROTOCOL=PLAINTEXT and KAFKA_BOOTSTRAP_SERVERS=localhost:9092.
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:default}" password="${KAFKA_PASSWORD:}";
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      enable-auto-commit: false
  datasource:
    url: jdbc:oracle:thin:@ecommerce_tp?TNS_ADMIN=${WALLET_DIR:/Users/raghavendra/Downloads/Wallet_ECOMMERCE}
    username: ${DB_USERNAME:ADMIN}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      connection-test-query: SELECT 1 FROM DUAL
      connection-init-sql: ALTER SESSION SET CURRENT_SCHEMA=PAYMENT
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only maps onto it
      ddl-auto: none
    properties:
      hibernate:
        # qualify every table with the service schema instead of relying on the session's CURRENT_SCHEMA
        default_schema: PAYMENT
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: PAYMENT
    default-schema: PAYMENT

server:
  tomcat:
    mbeanregistry:
      enabled: true
  port: ${SERVER_PORT:8085}

payment:
  # 3x exponential retry on transient PSP errors (TDD §14.6)
  provider-max-attempts: 3
  provider-backoff: 200ms
  # intents stuck in INITIATED / REQUIRES_ACTION longer than this are reconciled against the PSP (TDD §14.6)
  stuck-after: 1h
  events:
    # log = print events (no broker needed); kafka = publish to the topic below
    publisher: ${EVENTS_PUBLISHER:log}
    topic: domain.payment.events
    # true = open an intent when Order Service publishes PAYMENT_REQUESTED
    consumer-enabled: ${EVENTS_CONSUMER_ENABLED:false}
    # Topics are created at startup with these partition counts (free cluster quota: 10 topics, 64 partitions)
    create-topics: ${EVENTS_CREATE_TOPICS:true}
    partitions: 3
    order-topic: domain.order.events
  outbox:
    poll-interval: 1s
    batch-size: 100
  jobs:
    enabled: true
    webhook-poll-interval: 5s
    reconcile-interval: 15m
  # Webhooks are rejected (fail closed) while a provider's secret is empty.
  stripe:
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    webhook-tolerance: 5m
    # Stripe secret key from the environment, never from this file. Test mode: sk_test_... (free). Empty = simulated.
    api-key: ${STRIPE_SECRET_KEY:}
  razorpay:
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    # Razorpay Standard Checkout keys from the environment (test keys: rzp_test_...). Empty = simulated.
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tagsSorter: alpha
    operationsSorter: alpha
    tryItOutEnabled: true
  show-actuator: false


management:
  otlp:
    metrics:
      export:
        enabled: true
        # Pushes the same Micrometer metrics the Prometheus endpoint serves, so Grafana Cloud needs no scraper.
        # Auth headers come from OTEL_EXPORTER_OTLP_HEADERS; only active while OTEL_METRICS_EXPORTER=otlp.
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 30s
        base-time-unit: seconds
        resource-attributes:
          service.name: ${OTEL_SERVICE_NAME:${spring.application.name}}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
    data:
      repository:
        autotime:
          enabled: true
          percentiles-histogram: true
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Browser origins allowed to call this API (comma separated, e.g. the test console). Empty = none.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}
